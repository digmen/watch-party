name: CI

on:
  push:
  pull_request:

jobs:
  build-lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds packages/shared first (workspace dependency order), which apps/backend and
      # apps/frontend both need on disk before typecheck/lint can resolve @watch-party/shared.
      - name: Build (shared, then backend + frontend)
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: watch-party-backend:ci

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          tags: watch-party-frontend:ci

  # Деплой только при пуше в master, и только после того как всё выше зелёное — битый
  # тест/сборка не должны попасть на прод. Хост с этим доменом держит ещё и VPN другого
  # клиента (свой Caddy/Xray, свои платящие пользователи) — деплой намеренно ограничен
  # только этой директорией, к Caddyfile/Xray отношения не имеет и их не трогает.
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [build-lint-typecheck-test, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.WATCHPARTY_SSH_HOST }}
          username: root
          key: ${{ secrets.WATCHPARTY_SSH_KEY }}
          script: bash /root/watch-party/infra/scripts/deploy.sh
