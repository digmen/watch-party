# Optional edge container (enable with WP_EDGE=1 in infra/.env) for a host where 443 is taken.
# Browsers reach tv.kerry.zone:9443 directly; :80 only answers Let's Encrypt HTTP-01 challenges
# (and redirects). Cloudflare still reaches the old hostname on 9443 (self-signed /root/certs).
services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "9443:9443"
      - "80:80"
      # Only HAProxy on this host talks to it (SNI kerry.zone from :443), never the internet.
      - "127.0.0.1:9444:9444"
    volumes:
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - /root/certs:/certs:ro
      - edge-data:/data
    networks:
      - watchparty-net
    mem_limit: 128m
    depends_on:
      - backend
      - frontend

volumes:
  edge-data:
