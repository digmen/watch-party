# Port 443 router on the Prague host (installed 20.11.2026 as /etc/haproxy/haproxy.cfg — this file
# is the source of truth; the host copy is placed by hand, deploy.sh does not touch it).
#
# Port 443 has two tenants: the Watch Party site (https://kerry.zone) and Xray Reality (personal
# VPN). HAProxy only peeks at the TLS ClientHello's SNI — it never decrypts anything — and passes
# the raw TCP stream on, with a PROXY v2 header so both sides still see the client's real IP.
#   SNI kerry.zone  → edge Caddy 127.0.0.1:9444 (Watch Party)
#   anything else   → Xray 127.0.0.1:4443 (Reality decides; probes get addons.mozilla.org as before)
global
    log /dev/log local0 notice
    maxconn 20000
    user haproxy
    group haproxy
    daemon

defaults
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 2h
    timeout server 2h
    timeout client-fin 30s
    timeout server-fin 30s

frontend tls_443
    bind :::443 v4v6
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use_backend watchparty if { req_ssl_sni -i kerry.zone }
    default_backend xray

backend watchparty
    server edge 127.0.0.1:9444 send-proxy-v2

backend xray
    server xray 127.0.0.1:4443 send-proxy-v2
