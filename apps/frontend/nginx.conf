worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Don't advertise the exact nginx version in the Server header.
  server_tokens off;

  # Precompressed-at-build-time static assets (see Dockerfile) served as-is instead of paying
  # runtime compression CPU. Plain gzip_static, not brotli_static: that needs ngx_brotli, which
  # isn't in stock nginx (or openresty's default build) — would mean compiling nginx from source
  # for a marginal extra compression win. Noted as a possible follow-up, not blocking here.
  gzip_static on;
  # Responses vary by Accept-Encoding, so any shared cache in front must key on it.
  gzip_vary on;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # @fastify/helmet only covers backend responses — the SPA is served by this separate
    # container, so without these the actual HTML pages ship with no protections at all.
    # `always` matters: otherwise nginx omits them on error responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    location /assets/ {
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # Both are real files in the image — matched exactly so they can never fall through to the
    # SPA fallback below. A crawler receiving HTML with a 200 at /robots.txt is worse off than
    # receiving a plain 404, since it looks like a valid-but-unparseable file.
    location = /robots.txt {
      expires 1d;
      add_header Cache-Control "public";
    }

    location = /sitemap.xml {
      expires 1d;
      add_header Cache-Control "public";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
