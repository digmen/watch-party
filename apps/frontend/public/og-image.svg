<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Watch Party — смотрите видео вместе">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1116"/>
      <stop offset="100%" stop-color="#1d2430"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff6b5a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff6b5a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="960" cy="150" r="360" fill="url(#glow)"/>

  <g transform="translate(96, 150)">
    <circle cx="22" cy="22" r="22" fill="#ff6b5a"/>
    <path d="M14 11 L34 22 L14 33 Z" fill="#1a0d0a"/>
    <text x="62" y="32" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="30" font-weight="700" fill="#e9edf3" letter-spacing="0.5">Watch Party</text>
  </g>

  <text x="96" y="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="72" font-weight="700" fill="#e9edf3" letter-spacing="-1.5">Смотрите вместе,</text>
  <text x="96" y="412" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="72" font-weight="700" fill="#e9edf3" letter-spacing="-1.5">где бы вы ни были</text>

  <text x="96" y="486" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="30" fill="#98a3b3">Отправьте ссылку — и вы на одной секунде фильма</text>

  <rect x="96" y="530" width="300" height="4" rx="2" fill="#ff6b5a"/>
</svg>
